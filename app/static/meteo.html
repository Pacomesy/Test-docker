<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Horloge &amp; météo</title>
  <link rel="stylesheet" href="/assets/app.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <header>
    <div class="header-left">
      <h1>
        <span data-i18n="appTitle"></span>
        <span class="version-badge" id="appVersion" data-i18n-aria-label="versionAria"></span>
      </h1>
    </div>
    <div class="header-right">
      <div class="control-strip" id="controlStrip">
        <span id="controlStatusLabel" class="control-status"></span>
        <span id="controlFeedback" class="control-feedback" hidden role="status" aria-live="polite"></span>
        <button type="button" id="btnTakeControl" class="btn-secondary" hidden></button>
      </div>
      <div class="lang-switch" role="group" id="langSwitchGroup">
        <button type="button" class="btn-secondary lang-btn" data-set-lang="de" aria-pressed="false">DE</button>
        <button type="button" class="btn-secondary lang-btn" data-set-lang="fr" aria-pressed="false">FR</button>
        <button type="button" class="btn-secondary lang-btn" data-set-lang="it" aria-pressed="false">IT</button>
        <button type="button" class="btn-secondary lang-btn" data-set-lang="en" aria-pressed="false">EN</button>
      </div>
      <button type="button" id="btnAbout" class="btn-secondary" data-i18n="btnAbout"></button>
    </div>
  </header>
  <main id="appMain">
    <nav class="tabs app-nav" id="appNav" aria-label="">
      <a href="/" class="tab" id="navClock" data-sync-nav="/" data-i18n="tabClock"></a>
      <a href="/meteo" class="tab active" id="navMeteo" data-sync-nav="/meteo" data-i18n="tabTemp" aria-current="page"></a>
    </nav>

    <div class="tab-panel" id="panelTemp">
      <p class="temp-hint" id="tempHintPara"></p>
      <section class="controls temp-controls" id="tempControls" aria-label="">
        <div>
          <label for="geoQuery" data-i18n="labelPlace"></label>
          <input type="search" id="geoQuery" data-i18n-placeholder="phPlace" placeholder="" autocomplete="off" />
        </div>
        <button type="button" id="btnGeoSearch" class="btn-secondary" data-i18n="btnSearch"></button>
        <div>
          <label for="dateStart" data-i18n="labelDateStart"></label>
          <input type="date" id="dateStart" />
        </div>
        <div>
          <label for="dateEnd" data-i18n="labelDateEnd"></label>
          <input type="date" id="dateEnd" />
        </div>
        <div>
          <label for="resSelect" data-i18n="labelResolution"></label>
          <select id="resSelect">
            <option value="hour" data-i18n="resHour"></option>
            <option value="day" data-i18n="resDay"></option>
          </select>
        </div>
        <button type="button" id="btnLoadChart" data-i18n="btnLoadChart"></button>
      </section>
      <ul class="geo-results" id="geoResults" hidden aria-live="polite"></ul>
      <p class="selected-place" id="selectedPlaceLabel"></p>
      <p class="temp-warn" id="tempWarn" hidden></p>
      <div class="temp-chart-wrap">
        <p class="temp-plot-hint" id="tempPlotHint" hidden></p>
        <div id="tempPlot"></div>
      </div>
      <p class="temp-error" id="tempError" role="alert"></p>
    </div>
  </main>

  <dialog class="about-dialog" id="aboutDialog" aria-labelledby="aboutTitle">
    <div class="about-inner">
      <h2 id="aboutTitle" data-i18n="aboutTitle"></h2>
      <table class="about-table" id="aboutTable">
        <tbody id="aboutBody"></tbody>
      </table>
      <div class="about-actions">
        <button type="button" id="aboutClose" data-i18n="btnClose"></button>
      </div>
    </div>
  </dialog>

  <dialog class="about-dialog control-dialog" id="controlWaitDialog" aria-labelledby="controlWaitTitle">
    <div class="about-inner">
      <h2 id="controlWaitTitle"></h2>
      <p id="controlWaitText" class="control-dialog-p"></p>
      <p id="controlForceHint" class="control-force-hint" aria-live="polite"></p>
      <div class="about-actions control-dialog-actions">
        <button type="button" id="btnControlForce" class="btn-secondary" disabled></button>
        <button type="button" id="btnControlWaitCancel" class="btn-secondary"></button>
      </div>
    </div>
  </dialog>
  <dialog class="about-dialog control-dialog" id="controlApproveDialog" aria-labelledby="controlApproveTitle">
    <div class="about-inner">
      <h2 id="controlApproveTitle"></h2>
      <p id="controlApproveText" class="control-dialog-p"></p>
      <div class="about-actions control-dialog-actions">
        <button type="button" id="btnControlDeny" class="btn-secondary"></button>
        <button type="button" id="btnControlApprove"></button>
      </div>
    </div>
  </dialog>

  <script src="/assets/locales.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <script src="/assets/control-client.js"></script>
  <script src="/assets/meteo-page.js"></script>
</body>
</html>
