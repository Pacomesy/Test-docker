<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Horloge &amp; météo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3d9cf5;
      --accent-dim: #2563a8;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Outfit", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(61, 156, 245, 0.15), transparent);
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      justify-content: space-between;
    }
    .header-left { display: flex; flex-direction: column; gap: 0.35rem; }
    h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.5rem;
    }
    .version-badge {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .header-right {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: var(--surface);
      border-color: var(--accent);
    }
    .status {
      font-size: 0.85rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }
    .dot.ok { background: #4ade80; }
    main { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
    .tabs {
      display: flex;
      gap: 0.35rem;
      margin-bottom: 1.25rem;
      padding: 0.25rem;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
      width: fit-content;
      max-width: 100%;
      flex-wrap: wrap;
    }
    .tab {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.5rem 1.1rem;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      background: transparent;
      color: var(--muted);
    }
    .tab:hover { color: var(--text); background: rgba(61, 156, 245, 0.08); }
    .tab.active {
      color: var(--text);
      background: var(--bg);
      border-color: var(--border);
      box-shadow: 0 1px 0 rgba(61, 156, 245, 0.25);
    }
    .tab-panel[hidden] { display: none !important; }
    .tab-panel { margin-top: 0.25rem; }
    .temp-hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin: 0 0 1rem;
    }
    .geo-results {
      list-style: none;
      margin: 0 0 1rem;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      max-height: 200px;
      overflow-y: auto;
    }
    .geo-results li button {
      width: 100%;
      text-align: left;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      font-weight: 500;
    }
    .geo-results li button:hover { border-color: var(--accent); }
    .geo-results li button.selected {
      border-color: var(--accent);
      outline: 1px solid var(--accent);
    }
    .selected-place {
      font-size: 0.9rem;
      color: var(--muted);
      margin: 0 0 1rem;
      min-height: 1.25em;
    }
    .selected-place strong { color: var(--text); }
    input[type="date"] {
      font-family: inherit;
      font-size: 0.95rem;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      min-width: 11rem;
    }
    .temp-chart-wrap {
      margin-top: 1rem;
      padding: 1rem;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
      min-height: 320px;
      position: relative;
    }
    .temp-chart-wrap canvas { max-height: 420px; }
    .temp-error {
      margin: 0.75rem 0 0;
      font-size: 0.9rem;
      color: var(--danger);
      min-height: 1.25em;
    }
    .temp-warn {
      margin: 0.5rem 0 0;
      font-size: 0.85rem;
      color: #fbbf24;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: flex-end;
      margin-bottom: 1.5rem;
      padding: 1rem;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .hint-drag {
      font-size: 0.8rem;
      color: var(--muted);
      margin: 0 0 0.75rem;
    }
    label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.35rem; }
    input[type="search"], select {
      font-family: inherit;
      font-size: 0.95rem;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      min-width: 220px;
    }
    input:focus, select:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    button {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    button:hover { background: var(--accent-dim); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
    }
    .tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem;
      position: relative;
      cursor: grab;
      transition: outline 0.15s ease, opacity 0.15s ease;
    }
    .tile:active { cursor: grabbing; }
    .tile.dragging { opacity: 0.55; }
    .tile.drag-over {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .tile h2 {
      margin: 0 0 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding-right: 2rem;
    }
    .tile .time {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .tile .date { font-size: 0.85rem; color: var(--muted); margin-top: 0.35rem; }
    .tile .remove {
      position: absolute;
      top: 0.65rem;
      right: 0.65rem;
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 6px;
      font-size: 1rem;
      line-height: 1;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .tile .remove:hover { color: var(--danger); border-color: var(--danger); }
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      padding: 2rem;
    }
    dialog.about-dialog {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0;
      max-width: min(480px, 92vw);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
    }
    dialog.about-dialog::backdrop {
      background: rgba(0, 0, 0, 0.55);
    }
    .about-inner { padding: 1.25rem 1.5rem 1.5rem; }
    .about-dialog h2 {
      margin: 0 0 1rem;
      font-size: 1.15rem;
    }
    .about-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .about-table th,
    .about-table td {
      text-align: left;
      padding: 0.4rem 0.5rem 0.4rem 0;
      vertical-align: top;
      border-bottom: 1px solid var(--border);
    }
    .about-table th {
      color: var(--muted);
      font-weight: 600;
      width: 42%;
    }
    .about-dialog .about-actions {
      margin-top: 1.25rem;
      display: flex;
      justify-content: flex-end;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1>
        Horloge &amp; météo
        <span class="version-badge" id="appVersion" aria-label="Version application"></span>
      </h1>
    </div>
    <div class="header-right">
      <button type="button" id="btnAbout" class="btn-secondary">À propos</button>
      <div class="status">
        <span class="dot" id="wsDot" aria-hidden="true"></span>
        <span id="wsLabel">Connexion…</span>
      </div>
    </div>
  </header>
  <main>
    <div class="tabs" role="tablist" aria-label="Sections principales">
      <button type="button" class="tab active" role="tab" id="tabClock" aria-controls="panelClock" aria-selected="true">Horloge</button>
      <button type="button" class="tab" role="tab" id="tabTemp" aria-controls="panelTemp" aria-selected="false" tabindex="-1">Température</button>
    </div>

    <div class="tab-panel" id="panelClock" role="tabpanel" aria-labelledby="tabClock">
      <section class="controls" aria-label="Ajouter un fuseau">
        <div>
          <label for="tzSearch">Rechercher un fuseau IANA</label>
          <input type="search" id="tzSearch" placeholder="ex. Tokyo, Paris…" autocomplete="off" />
        </div>
        <div>
          <label for="tzSelect">Fuseau horaire</label>
          <select id="tzSelect"></select>
        </div>
        <button type="button" id="btnAdd">Ajouter la tuile</button>
      </section>
      <p class="hint-drag">Glissez-déposez les tuiles pour changer leur ordre (enregistré automatiquement).</p>
      <div class="grid" id="grid" role="list"></div>
    </div>

    <div class="tab-panel" id="panelTemp" role="tabpanel" aria-labelledby="tabTemp" hidden>
      <p class="temp-hint">Données historiques via <a href="https://open-meteo.com" target="_blank" rel="noopener noreferrer" style="color: var(--accent);">Open-Meteo</a>. Sélectionnez un lieu, une plage de dates (journées entières) et une résolution.</p>
      <section class="controls temp-controls" aria-label="Lieu et période">
        <div>
          <label for="geoQuery">Lieu</label>
          <input type="search" id="geoQuery" placeholder="ex. Lyon, Bruxelles…" autocomplete="off" />
        </div>
        <button type="button" id="btnGeoSearch" class="btn-secondary">Rechercher</button>
        <div>
          <label for="dateStart">Date début</label>
          <input type="date" id="dateStart" />
        </div>
        <div>
          <label for="dateEnd">Date fin</label>
          <input type="date" id="dateEnd" />
        </div>
        <div>
          <label for="resSelect">Résolution</label>
          <select id="resSelect">
            <option value="hour">Heure</option>
            <option value="day">Jour</option>
          </select>
        </div>
        <button type="button" id="btnLoadChart">Charger le graphique</button>
      </section>
      <ul class="geo-results" id="geoResults" hidden aria-live="polite"></ul>
      <p class="selected-place" id="selectedPlaceLabel"></p>
      <p class="temp-warn" id="tempWarn" hidden></p>
      <div class="temp-chart-wrap">
        <canvas id="tempChart" aria-label="Graphique de température"></canvas>
      </div>
      <p class="temp-error" id="tempError" role="alert"></p>
    </div>
  </main>

  <dialog class="about-dialog" id="aboutDialog" aria-labelledby="aboutTitle">
    <div class="about-inner">
      <h2 id="aboutTitle">À propos</h2>
      <table class="about-table" id="aboutTable">
        <tbody id="aboutBody"></tbody>
      </table>
      <div class="about-actions">
        <button type="button" id="aboutClose">Fermer</button>
      </div>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" crossorigin="anonymous"></script>
  <script>
    const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
    const wsUrl = `${proto}//${window.location.host}/ws`;
    const grid = document.getElementById("grid");
    const wsDot = document.getElementById("wsDot");
    const wsLabel = document.getElementById("wsLabel");
    const tzSelect = document.getElementById("tzSelect");
    const tzSearch = document.getElementById("tzSearch");
    const btnAdd = document.getElementById("btnAdd");
    const appVersionEl = document.getElementById("appVersion");
    const btnAbout = document.getElementById("btnAbout");
    const aboutDialog = document.getElementById("aboutDialog");
    const aboutBody = document.getElementById("aboutBody");
    const aboutClose = document.getElementById("aboutClose");
    const tabClock = document.getElementById("tabClock");
    const tabTemp = document.getElementById("tabTemp");
    const panelClock = document.getElementById("panelClock");
    const panelTemp = document.getElementById("panelTemp");
    const geoQuery = document.getElementById("geoQuery");
    const btnGeoSearch = document.getElementById("btnGeoSearch");
    const geoResults = document.getElementById("geoResults");
    const selectedPlaceLabel = document.getElementById("selectedPlaceLabel");
    const dateStart = document.getElementById("dateStart");
    const dateEnd = document.getElementById("dateEnd");
    const resSelect = document.getElementById("resSelect");
    const btnLoadChart = document.getElementById("btnLoadChart");
    const tempChartCanvas = document.getElementById("tempChart");
    const tempError = document.getElementById("tempError");
    const tempWarn = document.getElementById("tempWarn");

    const MAX_HOURLY_WARN_DAYS = 31;

    let tiles = [];
    let timesByTz = new Map();
    let allZones = [];
    let ws;
    let dragSourceId = null;
    let selectedPlace = null;
    let tempChartInstance = null;
    let geoHits = [];

    function setWsStatus(ok, text) {
      wsDot.classList.toggle("ok", ok);
      wsLabel.textContent = text;
    }

    async function loadAppVersion() {
      try {
        const r = await fetch("/api/version");
        const d = await r.json();
        appVersionEl.textContent = d.version ? `v${d.version}` : "";
      } catch {
        appVersionEl.textContent = "";
      }
    }

    function renderAboutRows(data) {
      const rows = [
        ["Application", data.app],
        ["Interface (front-end)", data.frontend],
        ["Backend — Python", data.backend?.python],
        ["Backend — FastAPI", data.backend?.fastapi],
        ["Backend — Uvicorn", data.backend?.uvicorn],
        ["Docker (image)", data.docker],
      ];
      const c = data.components || {};
      if (c.chart_js) rows.push(["Graphiques — Chart.js", c.chart_js]);
      if (c.open_meteo) rows.push(["Données météo — Open-Meteo", c.open_meteo]);
      if (c.fonts) rows.push(["Polices", c.fonts]);
      aboutBody.innerHTML = rows
        .map(
          ([k, v]) =>
            `<tr><th>${escapeHtml(k)}</th><td>${escapeHtml(String(v ?? "—"))}</td></tr>`
        )
        .join("");
    }

    btnAbout.addEventListener("click", async () => {
      try {
        const r = await fetch("/api/about");
        const d = await r.json();
        renderAboutRows(d);
        aboutDialog.showModal();
      } catch (e) {
        alert("Impossible de charger les informations : " + e);
      }
    });

    aboutClose.addEventListener("click", () => aboutDialog.close());

    function selectTab(which) {
      const isClock = which === "clock";
      tabClock.classList.toggle("active", isClock);
      tabTemp.classList.toggle("active", !isClock);
      tabClock.setAttribute("aria-selected", String(isClock));
      tabTemp.setAttribute("aria-selected", String(!isClock));
      tabClock.tabIndex = isClock ? 0 : -1;
      tabTemp.tabIndex = isClock ? -1 : 0;
      panelClock.hidden = !isClock;
      panelTemp.hidden = isClock;
    }

    tabClock.addEventListener("click", () => selectTab("clock"));
    tabTemp.addEventListener("click", () => selectTab("temp"));

    function countDaysInclusive(startStr, endStr) {
      const a = new Date(`${startStr}T12:00:00`);
      const b = new Date(`${endStr}T12:00:00`);
      return Math.floor((b - a) / 86400000) + 1;
    }

    function formatHourlyLabel(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleString("fr-FR", {
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    function updateSelectedPlaceLabel() {
      if (!selectedPlace) {
        selectedPlaceLabel.innerHTML = "";
        return;
      }
      selectedPlaceLabel.innerHTML = `Lieu sélectionné : <strong>${escapeHtml(
        selectedPlace.label
      )}</strong> (${selectedPlace.lat.toFixed(4)}°, ${selectedPlace.lon.toFixed(4)}°)`;
    }

    async function runGeoSearch() {
      tempError.textContent = "";
      const q = (geoQuery.value || "").trim();
      if (!q) {
        tempError.textContent = "Saisissez un lieu.";
        return;
      }
      btnGeoSearch.disabled = true;
      try {
        const url = new URL("https://geocoding-api.open-meteo.com/v1/search");
        url.searchParams.set("name", q);
        url.searchParams.set("count", "8");
        const r = await fetch(url);
        if (!r.ok) throw new Error("Géocodage indisponible.");
        const data = await r.json();
        geoHits = data.results || [];
        geoResults.innerHTML = "";
        if (!geoHits.length) {
          geoResults.hidden = true;
          tempError.textContent = "Aucun lieu trouvé.";
          selectedPlace = null;
          updateSelectedPlaceLabel();
          return;
        }
        geoResults.hidden = false;
        geoHits.forEach((hit, i) => {
          const li = document.createElement("li");
          const b = document.createElement("button");
          b.type = "button";
          const parts = [hit.name, hit.admin1, hit.country].filter(Boolean);
          b.textContent = `${parts.join(", ")} (${hit.latitude.toFixed(2)}°, ${hit.longitude.toFixed(2)}°)`;
          b.addEventListener("click", () => selectGeoHit(i));
          li.appendChild(b);
          geoResults.appendChild(li);
        });
      } catch (e) {
        tempError.textContent = e instanceof Error ? e.message : String(e);
        geoResults.hidden = true;
      } finally {
        btnGeoSearch.disabled = false;
      }
    }

    function selectGeoHit(i) {
      const hit = geoHits[i];
      if (!hit) return;
      selectedPlace = {
        lat: hit.latitude,
        lon: hit.longitude,
        label: [hit.name, hit.country].filter(Boolean).join(", "),
      };
      geoResults.querySelectorAll("button").forEach((btn, j) => {
        btn.classList.toggle("selected", j === i);
      });
      updateSelectedPlaceLabel();
      tempError.textContent = "";
    }

    async function loadTemperatureChart() {
      tempError.textContent = "";
      tempWarn.hidden = true;
      tempWarn.textContent = "";

      if (typeof Chart === "undefined") {
        tempError.textContent = "Chart.js n’est pas chargé.";
        return;
      }
      if (!selectedPlace) {
        tempError.textContent = "Recherchez et sélectionnez un lieu dans la liste.";
        return;
      }
      const start = dateStart.value;
      const end = dateEnd.value;
      if (!start || !end) {
        tempError.textContent = "Indiquez une date de début et une date de fin.";
        return;
      }
      if (start > end) {
        tempError.textContent = "La date de fin doit être après ou égale à la date de début.";
        return;
      }
      const res = resSelect.value;
      const dayCount = countDaysInclusive(start, end);
      if (res === "hour" && dayCount > MAX_HOURLY_WARN_DAYS) {
        tempWarn.hidden = false;
        tempWarn.textContent = `Plage de ${dayCount} jours en résolution horaire : le graphique peut être lent ou difficile à lire.`;
      }

      btnLoadChart.disabled = true;
      try {
        const url = new URL("https://archive-api.open-meteo.com/v1/archive");
        url.searchParams.set("latitude", String(selectedPlace.lat));
        url.searchParams.set("longitude", String(selectedPlace.lon));
        url.searchParams.set("start_date", start);
        url.searchParams.set("end_date", end);
        url.searchParams.set("timezone", "auto");
        if (res === "hour") {
          url.searchParams.set("hourly", "temperature_2m");
        } else {
          url.searchParams.set("daily", "temperature_2m_max,temperature_2m_min");
        }
        const r = await fetch(url);
        if (!r.ok) throw new Error("API météo indisponible.");
        const data = await r.json();
        if (data.error === true) {
          throw new Error(data.reason || "Erreur Open-Meteo.");
        }

        if (tempChartInstance) {
          tempChartInstance.destroy();
          tempChartInstance = null;
        }

        const chartTextColor = "#8b9cb3";
        const chartGridColor = "#2d3a4d";
        const titleColor = "#e7ecf3";
        const commonOptions = {
          responsive: true,
          maintainAspectRatio: true,
          aspectRatio: 2,
          plugins: {
            legend: { labels: { color: chartTextColor } },
            title: {
              display: true,
              text: `Température — ${selectedPlace.label}`,
              color: titleColor,
              font: { size: 14 },
            },
          },
          scales: {
            x: {
              ticks: { color: chartTextColor, maxRotation: res === "hour" ? 45 : 0 },
              grid: { color: chartGridColor },
            },
            y: {
              title: { display: true, text: "°C", color: chartTextColor },
              ticks: { color: chartTextColor },
              grid: { color: chartGridColor },
            },
          },
        };

        if (res === "hour") {
          const times = data.hourly?.time || [];
          const temps = data.hourly?.temperature_2m || [];
          if (!times.length) {
            tempError.textContent = "Aucune donnée horaire pour cette période.";
            return;
          }
          const labels = times.map(formatHourlyLabel);
          tempChartInstance = new Chart(tempChartCanvas, {
            type: "line",
            data: {
              labels,
              datasets: [
                {
                  label: "Température (°C)",
                  data: temps,
                  borderColor: "#3d9cf5",
                  backgroundColor: "rgba(61, 156, 245, 0.15)",
                  fill: true,
                  tension: 0.15,
                  pointRadius: 0,
                },
              ],
            },
            options: commonOptions,
          });
        } else {
          const times = data.daily?.time || [];
          const tmax = data.daily?.temperature_2m_max || [];
          const tmin = data.daily?.temperature_2m_min || [];
          if (!times.length) {
            tempError.textContent = "Aucune donnée journalière pour cette période.";
            return;
          }
          tempChartInstance = new Chart(tempChartCanvas, {
            type: "line",
            data: {
              labels: times,
              datasets: [
                {
                  label: "Max (°C)",
                  data: tmax,
                  borderColor: "#f87171",
                  backgroundColor: "rgba(248, 113, 113, 0.08)",
                  tension: 0.2,
                  pointRadius: 2,
                },
                {
                  label: "Min (°C)",
                  data: tmin,
                  borderColor: "#3d9cf5",
                  backgroundColor: "rgba(61, 156, 245, 0.08)",
                  tension: 0.2,
                  pointRadius: 2,
                },
              ],
            },
            options: commonOptions,
          });
        }
      } catch (e) {
        tempError.textContent = e instanceof Error ? e.message : String(e);
      } finally {
        btnLoadChart.disabled = false;
      }
    }

    btnGeoSearch.addEventListener("click", runGeoSearch);
    geoQuery.addEventListener("keydown", (e) => {
      if (e.key === "Enter") runGeoSearch();
    });
    btnLoadChart.addEventListener("click", loadTemperatureChart);

    function initDefaultDates() {
      const end = new Date();
      const start = new Date();
      start.setDate(start.getDate() - 14);
      const pad = (n) => String(n).padStart(2, "0");
      const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      dateEnd.value = ymd(end);
      dateStart.value = ymd(start);
    }
    initDefaultDates();

    function render() {
      grid.innerHTML = "";
      if (!tiles.length) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "Aucune tuile. Ajoutez un fuseau ci-dessus.";
        grid.appendChild(p);
        return;
      }
      for (const t of tiles) {
        const info = timesByTz.get(t.timezone) || {};
        const el = document.createElement("article");
        el.className = "tile";
        el.setAttribute("role", "listitem");
        el.draggable = true;
        el.dataset.id = t.id;
        el.innerHTML = `
          <h2>${escapeHtml(t.timezone)}</h2>
          <div class="time">${escapeHtml(info.time || "—")}</div>
          <div class="date">${escapeHtml([info.date, info.offset].filter(Boolean).join(" "))}</div>
          <button type="button" class="remove" draggable="false" data-id="${escapeHtml(t.id)}" title="Retirer">×</button>
        `;
        const rm = el.querySelector(".remove");
        rm.addEventListener("click", (ev) => {
          ev.stopPropagation();
          removeTile(t.id);
        });
        rm.addEventListener("mousedown", (ev) => ev.stopPropagation());
        grid.appendChild(el);
      }
    }

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function applyTimes(times) {
      timesByTz.clear();
      for (const x of times || []) {
        timesByTz.set(x.timezone, x);
      }
      render();
    }

    function connectWs() {
      ws = new WebSocket(wsUrl);
      ws.onopen = () => setWsStatus(true, "Temps réel actif");
      ws.onclose = () => {
        setWsStatus(false, "Déconnecté — reconnexion…");
        setTimeout(connectWs, 2000);
      };
      ws.onerror = () => setWsStatus(false, "Erreur réseau");
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === "init" || msg.type === "tick") {
          tiles = msg.tiles || tiles;
          applyTimes(msg.times);
        } else if (msg.type === "tiles_updated") {
          tiles = msg.tiles || [];
          render();
        }
      };
    }

    grid.addEventListener("dragstart", (e) => {
      const tile = e.target.closest(".tile");
      if (!tile || e.target.closest(".remove")) {
        e.preventDefault();
        return;
      }
      dragSourceId = tile.dataset.id;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", dragSourceId);
      tile.classList.add("dragging");
    });

    grid.addEventListener("dragend", (e) => {
      grid.querySelectorAll(".tile.dragging, .tile.drag-over").forEach((el) => {
        el.classList.remove("dragging", "drag-over");
      });
      dragSourceId = null;
    });

    grid.addEventListener("dragover", (e) => {
      const tile = e.target.closest(".tile");
      if (!tile || !dragSourceId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
    });

    grid.addEventListener("dragenter", (e) => {
      const tile = e.target.closest(".tile");
      if (!tile || !dragSourceId || tile.dataset.id === dragSourceId) return;
      tile.classList.add("drag-over");
    });

    grid.addEventListener("dragleave", (e) => {
      const tile = e.target.closest(".tile");
      if (tile && e.relatedTarget && !tile.contains(e.relatedTarget)) {
        tile.classList.remove("drag-over");
      }
    });

    grid.addEventListener("drop", async (e) => {
      e.preventDefault();
      const targetTile = e.target.closest(".tile");
      grid.querySelectorAll(".tile.drag-over").forEach((el) => el.classList.remove("drag-over"));
      if (!targetTile || !dragSourceId) return;
      const targetId = targetTile.dataset.id;
      const sourceId = dragSourceId;
      if (sourceId === targetId) return;
      const from = tiles.findIndex((t) => t.id === sourceId);
      const to = tiles.findIndex((t) => t.id === targetId);
      if (from < 0 || to < 0) return;
      const prev = tiles.map((t) => ({ ...t }));
      const next = [...tiles];
      const [moved] = next.splice(from, 1);
      next.splice(to, 0, moved);
      tiles = next;
      render();
      try {
        const r = await fetch("/api/tiles/order", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ order: next.map((t) => t.id) }),
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          tiles = prev;
          render();
          alert(err.detail || r.statusText);
        }
      } catch (err) {
        tiles = prev;
        render();
        alert(String(err));
      }
    });

    async function loadTimezones() {
      const r = await fetch("/api/timezones?limit=500");
      const data = await r.json();
      allZones = data.timezones || [];
      filterSelect();
    }

    function filterSelect() {
      const q = (tzSearch.value || "").toLowerCase();
      const filtered = q
        ? allZones.filter((z) => z.toLowerCase().includes(q))
        : allZones.slice(0, 150);
      tzSelect.innerHTML = "";
      for (const z of filtered.slice(0, 200)) {
        const opt = document.createElement("option");
        opt.value = z;
        opt.textContent = z;
        tzSelect.appendChild(opt);
      }
      if (!tzSelect.options.length) {
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "Aucun résultat";
        tzSelect.appendChild(opt);
      }
    }

    tzSearch.addEventListener("input", filterSelect);

    btnAdd.addEventListener("click", async () => {
      const timezone = tzSelect.value;
      if (!timezone) return;
      btnAdd.disabled = true;
      try {
        const r = await fetch("/api/tiles", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ timezone }),
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          alert(err.detail || r.statusText);
        }
      } finally {
        btnAdd.disabled = false;
      }
    });

    async function removeTile(id) {
      const r = await fetch(`/api/tiles/${encodeURIComponent(id)}`, { method: "DELETE" });
      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        alert(err.detail || r.statusText);
      }
    }

    loadAppVersion();
    loadTimezones();
    connectWs();
  </script>
</body>
</html>
