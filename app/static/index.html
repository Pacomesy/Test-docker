<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Horloge &amp; météo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3d9cf5;
      --accent-dim: #2563a8;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Outfit", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(61, 156, 245, 0.15), transparent);
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      justify-content: space-between;
    }
    .header-left { display: flex; flex-direction: column; gap: 0.35rem; }
    h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.5rem;
    }
    .version-badge {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .header-right {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }
    .lang-switch {
      display: flex;
      gap: 0.25rem;
      align-items: center;
    }
    .lang-switch .lang-btn {
      padding: 0.35rem 0.55rem;
      font-size: 0.8rem;
      font-weight: 600;
      min-width: auto;
    }
    .lang-switch .lang-btn.active {
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: var(--surface);
      border-color: var(--accent);
    }
    .status {
      font-size: 0.85rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }
    .dot.ok { background: #4ade80; }
    main { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
    .tabs {
      display: flex;
      gap: 0.35rem;
      margin-bottom: 1.25rem;
      padding: 0.25rem;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
      width: fit-content;
      max-width: 100%;
      flex-wrap: wrap;
    }
    .tab {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.5rem 1.1rem;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      background: transparent;
      color: var(--muted);
    }
    .tab:hover { color: var(--text); background: rgba(61, 156, 245, 0.08); }
    .tab.active {
      color: var(--text);
      background: var(--bg);
      border-color: var(--border);
      box-shadow: 0 1px 0 rgba(61, 156, 245, 0.25);
    }
    .tab-panel[hidden] { display: none !important; }
    .tab-panel { margin-top: 0.25rem; }
    .temp-hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin: 0 0 1rem;
    }
    .geo-results {
      list-style: none;
      margin: 0 0 1rem;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      max-height: 200px;
      overflow-y: auto;
    }
    .geo-results li button {
      width: 100%;
      text-align: left;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      font-weight: 500;
    }
    .geo-results li button:hover { border-color: var(--accent); }
    .geo-results li button.selected {
      border-color: var(--accent);
      outline: 1px solid var(--accent);
    }
    .selected-place {
      font-size: 0.9rem;
      color: var(--muted);
      margin: 0 0 1rem;
      min-height: 1.25em;
    }
    .selected-place strong { color: var(--text); }
    input[type="date"] {
      font-family: inherit;
      font-size: 0.95rem;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      min-width: 11rem;
    }
    .temp-chart-wrap {
      margin-top: 1rem;
      padding: 1rem;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
      min-height: 320px;
      position: relative;
    }
    .temp-chart-wrap #tempPlot {
      width: 100%;
      min-height: 400px;
    }
    .temp-error {
      margin: 0.75rem 0 0;
      font-size: 0.9rem;
      color: var(--danger);
      min-height: 1.25em;
    }
    .temp-warn {
      margin: 0.5rem 0 0;
      font-size: 0.85rem;
      color: #fbbf24;
    }
    .temp-plot-hint {
      font-size: 0.78rem;
      color: var(--muted);
      margin: 0 0 0.5rem;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: flex-end;
      margin-bottom: 1.5rem;
      padding: 1rem;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .hint-drag {
      font-size: 0.8rem;
      color: var(--muted);
      margin: 0 0 0.75rem;
    }
    label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.35rem; }
    input[type="search"], select {
      font-family: inherit;
      font-size: 0.95rem;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      min-width: 220px;
    }
    input:focus, select:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    button {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    button:hover { background: var(--accent-dim); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
    }
    .tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem;
      position: relative;
      cursor: grab;
      transition: outline 0.15s ease, opacity 0.15s ease;
    }
    .tile:active { cursor: grabbing; }
    .tile.dragging { opacity: 0.55; }
    .tile.drag-over {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .tile h2 {
      margin: 0 0 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding-right: 2rem;
    }
    .tile .time {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .tile .date { font-size: 0.85rem; color: var(--muted); margin-top: 0.35rem; }
    .tile .remove {
      position: absolute;
      top: 0.65rem;
      right: 0.65rem;
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 6px;
      font-size: 1rem;
      line-height: 1;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .tile .remove:hover { color: var(--danger); border-color: var(--danger); }
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      padding: 2rem;
    }
    dialog.about-dialog {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0;
      max-width: min(480px, 92vw);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
    }
    dialog.about-dialog::backdrop {
      background: rgba(0, 0, 0, 0.55);
    }
    .about-inner { padding: 1.25rem 1.5rem 1.5rem; }
    .about-dialog h2 {
      margin: 0 0 1rem;
      font-size: 1.15rem;
    }
    .about-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .about-table th,
    .about-table td {
      text-align: left;
      padding: 0.4rem 0.5rem 0.4rem 0;
      vertical-align: top;
      border-bottom: 1px solid var(--border);
    }
    .about-table th {
      color: var(--muted);
      font-weight: 600;
      width: 42%;
    }
    .about-dialog .about-actions {
      margin-top: 1.25rem;
      display: flex;
      justify-content: flex-end;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1>
        <span data-i18n="appTitle"></span>
        <span class="version-badge" id="appVersion" data-i18n-aria-label="versionAria"></span>
      </h1>
    </div>
    <div class="header-right">
      <div class="lang-switch" role="group" id="langSwitchGroup">
        <button type="button" class="btn-secondary lang-btn" data-set-lang="de" aria-pressed="false">DE</button>
        <button type="button" class="btn-secondary lang-btn" data-set-lang="fr" aria-pressed="false">FR</button>
        <button type="button" class="btn-secondary lang-btn" data-set-lang="it" aria-pressed="false">IT</button>
        <button type="button" class="btn-secondary lang-btn" data-set-lang="en" aria-pressed="false">EN</button>
      </div>
      <button type="button" id="btnAbout" class="btn-secondary" data-i18n="btnAbout"></button>
      <div class="status">
        <span class="dot" id="wsDot" aria-hidden="true"></span>
        <span id="wsLabel"></span>
      </div>
    </div>
  </header>
  <main>
    <div class="tabs" role="tablist" id="mainTabs" aria-label="">
      <button type="button" class="tab active" role="tab" id="tabClock" aria-controls="panelClock" aria-selected="true"></button>
      <button type="button" class="tab" role="tab" id="tabTemp" aria-controls="panelTemp" aria-selected="false" tabindex="-1"></button>
    </div>

    <div class="tab-panel" id="panelClock" role="tabpanel" aria-labelledby="tabClock">
      <section class="controls" id="clockControls" aria-label="">
        <div>
          <label for="tzSearch" data-i18n="labelTzSearch"></label>
          <input type="search" id="tzSearch" data-i18n-placeholder="phTzSearch" placeholder="" autocomplete="off" />
        </div>
        <div>
          <label for="tzSelect" data-i18n="labelTzSelect"></label>
          <select id="tzSelect"></select>
        </div>
        <button type="button" id="btnAdd" data-i18n="btnAddTile"></button>
      </section>
      <p class="hint-drag" data-i18n="hintDrag"></p>
      <div class="grid" id="grid" role="list"></div>
    </div>

    <div class="tab-panel" id="panelTemp" role="tabpanel" aria-labelledby="tabTemp" hidden>
      <p class="temp-hint" id="tempHintPara"></p>
      <section class="controls temp-controls" id="tempControls" aria-label="">
        <div>
          <label for="geoQuery" data-i18n="labelPlace"></label>
          <input type="search" id="geoQuery" data-i18n-placeholder="phPlace" placeholder="" autocomplete="off" />
        </div>
        <button type="button" id="btnGeoSearch" class="btn-secondary" data-i18n="btnSearch"></button>
        <div>
          <label for="dateStart" data-i18n="labelDateStart"></label>
          <input type="date" id="dateStart" />
        </div>
        <div>
          <label for="dateEnd" data-i18n="labelDateEnd"></label>
          <input type="date" id="dateEnd" />
        </div>
        <div>
          <label for="resSelect" data-i18n="labelResolution"></label>
          <select id="resSelect">
            <option value="hour" data-i18n="resHour"></option>
            <option value="day" data-i18n="resDay"></option>
          </select>
        </div>
        <button type="button" id="btnLoadChart" data-i18n="btnLoadChart"></button>
      </section>
      <ul class="geo-results" id="geoResults" hidden aria-live="polite"></ul>
      <p class="selected-place" id="selectedPlaceLabel"></p>
      <p class="temp-warn" id="tempWarn" hidden></p>
      <div class="temp-chart-wrap">
        <p class="temp-plot-hint" id="tempPlotHint" hidden></p>
        <div id="tempPlot"></div>
      </div>
      <p class="temp-error" id="tempError" role="alert"></p>
    </div>
  </main>

  <dialog class="about-dialog" id="aboutDialog" aria-labelledby="aboutTitle">
    <div class="about-inner">
      <h2 id="aboutTitle" data-i18n="aboutTitle"></h2>
      <table class="about-table" id="aboutTable">
        <tbody id="aboutBody"></tbody>
      </table>
      <div class="about-actions">
        <button type="button" id="aboutClose" data-i18n="btnClose"></button>
      </div>
    </div>
  </dialog>

  <script src="/assets/locales.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <script>
    const LOCALE_STORAGE_KEY = "appLocale";

    function readStoredLocale() {
      const T = window.APP_I18N || {};
      const raw = localStorage.getItem(LOCALE_STORAGE_KEY);
      if (raw && T[raw]) return raw;
      const nav = (navigator.language || "fr").slice(0, 2).toLowerCase();
      if (T[nav]) return nav;
      return "fr";
    }

    let locale = readStoredLocale();
    document.documentElement.lang = locale;

    function t(key, params) {
      const T = window.APP_I18N || {};
      const table = T[locale] || T.fr || {};
      let s = table[key] ?? T.fr?.[key] ?? key;
      if (params) {
        for (const [k, v] of Object.entries(params)) {
          s = s.split(`{${k}}`).join(String(v));
        }
      }
      return s;
    }

    function apiFetch(input, init = {}) {
      const opt = { ...init };
      opt.headers = new Headers(init.headers || {});
      opt.headers.set("X-App-Locale", locale);
      return fetch(input, opt);
    }

    function formatTileDateTime(info) {
      if (!info || !info.date) return "—";
      const [y, m, d] = info.date.split("-").map(Number);
      const parts = (info.time || "00:00:00").split(":");
      const hh = Number(parts[0] || 0);
      const mm = Number(parts[1] || 0);
      const ss = Number(parts[2] || 0);
      const pad = (n) => String(n).padStart(2, "0");
      let line = `${pad(d)}.${pad(m)}.${y} ${pad(hh)}:${pad(mm)}:${pad(ss)}`;
      if (info.offset) line += ` ${String(info.offset).trim()}`;
      return line;
    }

    let lastChartPayload = null;

    function updateLangButtons() {
      document.querySelectorAll("[data-set-lang]").forEach((btn) => {
        const on = btn.getAttribute("data-set-lang") === locale;
        btn.classList.toggle("active", on);
        btn.setAttribute("aria-pressed", String(on));
      });
    }

    function applyLocale() {
      document.documentElement.lang = locale;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = t(el.getAttribute("data-i18n"));
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
        el.setAttribute("placeholder", t(el.getAttribute("data-i18n-placeholder")));
      });
      document.querySelectorAll("[data-i18n-aria-label]").forEach((el) => {
        el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria-label")));
      });
      const g = document.getElementById("langSwitchGroup");
      if (g) g.setAttribute("aria-label", t("langGroupAria"));
      const langAria = { de: "langDE", fr: "langFR", it: "langIT", en: "langEN" };
      document.querySelectorAll("[data-set-lang]").forEach((btn) => {
        const code = btn.getAttribute("data-set-lang");
        btn.setAttribute("aria-label", t(langAria[code] || "langEN"));
      });
      const mt = document.getElementById("mainTabs");
      if (mt) mt.setAttribute("aria-label", t("tablistAria"));
      const cc = document.getElementById("clockControls");
      if (cc) cc.setAttribute("aria-label", t("clockSectionAria"));
      const tc = document.getElementById("tempControls");
      if (tc) tc.setAttribute("aria-label", t("tempSectionAria"));
      const oh = resSelect.querySelector('option[value="hour"]');
      if (oh) oh.textContent = t("resHour");
      const od = resSelect.querySelector('option[value="day"]');
      if (od) od.textContent = t("resDay");
      tabClock.textContent = t("tabClock");
      tabTemp.textContent = t("tabTemp");
      if (tempPlotHint) {
        tempPlotHint.textContent = t("tempPlotHint");
      }
      tempPlot.setAttribute("aria-label", t("tempPlotAria"));
      const hintEl = document.getElementById("tempHintPara");
      if (hintEl) {
        hintEl.innerHTML = `${escapeHtml(t("tempHint1"))} <a href="https://open-meteo.com" target="_blank" rel="noopener noreferrer" style="color: var(--accent);">Open-Meteo</a>. ${escapeHtml(t("tempHint2"))}`;
      }
      filterSelect();
      render();
      updateLangButtons();
      refreshWsLabel();
      document.title = t("appTitle");
      if (typeof Plotly !== "undefined" && lastChartPayload && tempPlot.querySelector(".js-plotly-plot")) {
        redrawPlotFromCache();
      }
    }

    function setLanguage(code) {
      if (!window.APP_I18N?.[code]) return;
      locale = code;
      localStorage.setItem(LOCALE_STORAGE_KEY, code);
      applyLocale();
    }

    document.querySelectorAll("[data-set-lang]").forEach((btn) => {
      btn.addEventListener("click", () => setLanguage(btn.getAttribute("data-set-lang")));
    });

    let wsConnected = false;

    function refreshWsLabel() {
      if (!ws) {
        wsLabel.textContent = t("wsConnecting");
        return;
      }
      if (ws.readyState === WebSocket.OPEN) setWsStatus(true, t("wsLive"));
      else if (ws.readyState === WebSocket.CONNECTING) setWsStatus(false, t("wsConnecting"));
      else setWsStatus(false, t("wsReconnecting"));
    }

    const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
    const wsUrl = `${proto}//${window.location.host}/ws`;
    const grid = document.getElementById("grid");
    const wsDot = document.getElementById("wsDot");
    const wsLabel = document.getElementById("wsLabel");
    const tzSelect = document.getElementById("tzSelect");
    const tzSearch = document.getElementById("tzSearch");
    const btnAdd = document.getElementById("btnAdd");
    const appVersionEl = document.getElementById("appVersion");
    const btnAbout = document.getElementById("btnAbout");
    const aboutDialog = document.getElementById("aboutDialog");
    const aboutBody = document.getElementById("aboutBody");
    const aboutClose = document.getElementById("aboutClose");
    const tabClock = document.getElementById("tabClock");
    const tabTemp = document.getElementById("tabTemp");
    const panelClock = document.getElementById("panelClock");
    const panelTemp = document.getElementById("panelTemp");
    const geoQuery = document.getElementById("geoQuery");
    const btnGeoSearch = document.getElementById("btnGeoSearch");
    const geoResults = document.getElementById("geoResults");
    const selectedPlaceLabel = document.getElementById("selectedPlaceLabel");
    const dateStart = document.getElementById("dateStart");
    const dateEnd = document.getElementById("dateEnd");
    const resSelect = document.getElementById("resSelect");
    const btnLoadChart = document.getElementById("btnLoadChart");
    const tempPlot = document.getElementById("tempPlot");
    const tempPlotHint = document.getElementById("tempPlotHint");
    const tempError = document.getElementById("tempError");
    const tempWarn = document.getElementById("tempWarn");

    const MAX_HOURLY_WARN_DAYS = 31;

    let tiles = [];
    let timesByTz = new Map();
    let allZones = [];
    let ws;
    let dragSourceId = null;
    let selectedPlace = null;
    let geoHits = [];

    const plotlyConfig = {
      responsive: true,
      scrollZoom: true,
      displayModeBar: true,
      displaylogo: false,
      showAxisDragHandles: true,
      showAxisRangeEntryBoxes: false,
      modeBarButtonsToRemove: ["lasso2d", "select2d"],
    };

    function plotlyBaseLayout(titleText) {
      return {
        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "#0f1419",
        font: { color: "#e7ecf3", family: "Outfit, system-ui, sans-serif", size: 12 },
        title: { text: titleText, font: { size: 15 } },
        xaxis: {
          type: "date",
          gridcolor: "#2d3a4d",
          zerolinecolor: "#2d3a4d",
          linecolor: "#2d3a4d",
          tickfont: { color: "#8b9cb3" },
        },
        yaxis: {
          title: t("yAxisC"),
          gridcolor: "#2d3a4d",
          zerolinecolor: "#2d3a4d",
          linecolor: "#2d3a4d",
          tickfont: { color: "#8b9cb3" },
        },
        legend: {
          font: { color: "#8b9cb3" },
          bgcolor: "rgba(0,0,0,0)",
        },
        margin: { t: 56, r: 24, b: 72, l: 56 },
        hovermode: "x unified",
        dragmode: "zoom",
      };
    }

    function buildPlotlyFigure(res, data, placeLabel) {
      const titleText = t("plotTitle", { label: placeLabel });
      if (res === "hour") {
        const times = data.hourly?.time || [];
        const temps = data.hourly?.temperature_2m || [];
        const traces = [
          {
            x: times,
            y: temps,
            type: "scatter",
            mode: "lines",
            name: t("traceTemp"),
            line: { color: "#3d9cf5", width: 2, shape: "spline" },
            fill: "tozeroy",
            fillcolor: "rgba(61, 156, 245, 0.12)",
            hovertemplate: t("hoverHour"),
          },
        ];
        return { traces, layout: plotlyBaseLayout(titleText) };
      }
      const times = data.daily?.time || [];
      const tmax = data.daily?.temperature_2m_max || [];
      const tmin = data.daily?.temperature_2m_min || [];
      const traces = [
        {
          x: times,
          y: tmax,
          type: "scatter",
          mode: "lines+markers",
          name: t("traceMax"),
          line: { color: "#f87171", width: 2, shape: "spline" },
          marker: { size: 5, color: "#f87171" },
          hovertemplate: t("hoverMaxLine"),
        },
        {
          x: times,
          y: tmin,
          type: "scatter",
          mode: "lines+markers",
          name: t("traceMin"),
          line: { color: "#3d9cf5", width: 2, shape: "spline" },
          marker: { size: 5, color: "#3d9cf5" },
          hovertemplate: t("hoverMinLine"),
        },
      ];
      return { traces, layout: plotlyBaseLayout(titleText) };
    }

    async function redrawPlotFromCache() {
      if (!lastChartPayload || typeof Plotly === "undefined") return;
      const { res, data, placeLabel } = lastChartPayload;
      const { traces, layout } = buildPlotlyFigure(res, data, placeLabel);
      if (tempPlot.querySelector(".js-plotly-plot")) {
        await Plotly.react(tempPlot, traces, layout, plotlyConfig);
      }
    }

    function setWsStatus(ok, text) {
      wsDot.classList.toggle("ok", ok);
      wsLabel.textContent = text;
    }

    async function loadAppVersion() {
      try {
        const r = await apiFetch("/api/version");
        const d = await r.json();
        appVersionEl.textContent = d.version ? `v${d.version}` : "";
      } catch {
        appVersionEl.textContent = "";
      }
    }

    function fmtAboutCell(v) {
      if (v == null || v === "") return t("aboutMissing");
      return String(v);
    }

    function renderAboutRows(data) {
      const rows = [
        [t("aboutApp"), fmtAboutCell(data.app)],
        [t("aboutFrontend"), fmtAboutCell(data.frontend)],
        [t("aboutBackendPython"), fmtAboutCell(data.backend?.python)],
        [t("aboutBackendFastapi"), fmtAboutCell(data.backend?.fastapi)],
        [t("aboutBackendUvicorn"), fmtAboutCell(data.backend?.uvicorn)],
        [
          t("aboutDocker"),
          data.docker != null && data.docker !== ""
            ? String(data.docker)
            : t("aboutDockerUnset"),
        ],
      ];
      const c = data.components || {};
      if (c.plotly) rows.push([t("aboutPlotly"), fmtAboutCell(c.plotly)]);
      if (c.open_meteo) rows.push([t("aboutOpenMeteo"), fmtAboutCell(c.open_meteo)]);
      if (c.fonts) rows.push([t("aboutFonts"), fmtAboutCell(c.fonts)]);
      aboutBody.innerHTML = rows
        .map(
          ([k, v]) =>
            `<tr><th>${escapeHtml(k)}</th><td>${escapeHtml(v)}</td></tr>`
        )
        .join("");
    }

    btnAbout.addEventListener("click", async () => {
      try {
        const r = await apiFetch("/api/about");
        const d = await r.json();
        renderAboutRows(d);
        aboutDialog.showModal();
      } catch (e) {
        alert(`${t("errAboutLoad")} ${e}`);
      }
    });

    aboutClose.addEventListener("click", () => aboutDialog.close());

    function selectTab(which) {
      const isClock = which === "clock";
      tabClock.classList.toggle("active", isClock);
      tabTemp.classList.toggle("active", !isClock);
      tabClock.setAttribute("aria-selected", String(isClock));
      tabTemp.setAttribute("aria-selected", String(!isClock));
      tabClock.tabIndex = isClock ? 0 : -1;
      tabTemp.tabIndex = isClock ? -1 : 0;
      panelClock.hidden = !isClock;
      panelTemp.hidden = isClock;
    }

    tabClock.addEventListener("click", () => selectTab("clock"));
    tabTemp.addEventListener("click", () => selectTab("temp"));

    function countDaysInclusive(startStr, endStr) {
      const a = new Date(`${startStr}T12:00:00`);
      const b = new Date(`${endStr}T12:00:00`);
      return Math.floor((b - a) / 86400000) + 1;
    }

    function updateSelectedPlaceLabel() {
      if (!selectedPlace) {
        selectedPlaceLabel.innerHTML = "";
        return;
      }
      selectedPlaceLabel.innerHTML = `${escapeHtml(t("selectedPlace"))} <strong>${escapeHtml(
        selectedPlace.label
      )}</strong> (${selectedPlace.lat.toFixed(4)}°, ${selectedPlace.lon.toFixed(4)}°)`;
    }

    async function runGeoSearch() {
      tempError.textContent = "";
      const q = (geoQuery.value || "").trim();
      if (!q) {
        tempError.textContent = t("errGeoEmpty");
        return;
      }
      btnGeoSearch.disabled = true;
      try {
        const url = new URL("https://geocoding-api.open-meteo.com/v1/search");
        url.searchParams.set("name", q);
        url.searchParams.set("count", "8");
        const r = await fetch(url);
        if (!r.ok) throw new Error(t("errGeoUnavailable"));
        const data = await r.json();
        geoHits = data.results || [];
        geoResults.innerHTML = "";
        if (!geoHits.length) {
          geoResults.hidden = true;
          tempError.textContent = t("errNoPlaces");
          selectedPlace = null;
          updateSelectedPlaceLabel();
          return;
        }
        geoResults.hidden = false;
        geoHits.forEach((hit, i) => {
          const li = document.createElement("li");
          const b = document.createElement("button");
          b.type = "button";
          const parts = [hit.name, hit.admin1, hit.country].filter(Boolean);
          b.textContent = `${parts.join(", ")} (${hit.latitude.toFixed(2)}°, ${hit.longitude.toFixed(2)}°)`;
          b.addEventListener("click", () => selectGeoHit(i));
          li.appendChild(b);
          geoResults.appendChild(li);
        });
      } catch (e) {
        tempError.textContent = e instanceof Error ? e.message : String(e);
        geoResults.hidden = true;
      } finally {
        btnGeoSearch.disabled = false;
      }
    }

    function selectGeoHit(i) {
      const hit = geoHits[i];
      if (!hit) return;
      selectedPlace = {
        lat: hit.latitude,
        lon: hit.longitude,
        label: [hit.name, hit.country].filter(Boolean).join(", "),
      };
      geoResults.querySelectorAll("button").forEach((btn, j) => {
        btn.classList.toggle("selected", j === i);
      });
      updateSelectedPlaceLabel();
      tempError.textContent = "";
    }

    async function loadTemperatureChart() {
      tempError.textContent = "";
      tempWarn.hidden = true;
      tempWarn.textContent = "";

      if (typeof Plotly === "undefined") {
        tempError.textContent = t("errPlotly");
        return;
      }
      if (!selectedPlace) {
        tempError.textContent = t("errSelectPlace");
        return;
      }
      const start = dateStart.value;
      const end = dateEnd.value;
      if (!start || !end) {
        tempError.textContent = t("errDatesRequired");
        return;
      }
      if (start > end) {
        tempError.textContent = t("errDateOrder");
        return;
      }
      const res = resSelect.value;
      const dayCount = countDaysInclusive(start, end);
      if (res === "hour" && dayCount > MAX_HOURLY_WARN_DAYS) {
        tempWarn.hidden = false;
        tempWarn.textContent = t("warnHourlyRange", { days: dayCount });
      }

      btnLoadChart.disabled = true;
      try {
        const url = new URL("https://archive-api.open-meteo.com/v1/archive");
        url.searchParams.set("latitude", String(selectedPlace.lat));
        url.searchParams.set("longitude", String(selectedPlace.lon));
        url.searchParams.set("start_date", start);
        url.searchParams.set("end_date", end);
        url.searchParams.set("timezone", "auto");
        if (res === "hour") {
          url.searchParams.set("hourly", "temperature_2m");
        } else {
          url.searchParams.set("daily", "temperature_2m_max,temperature_2m_min");
        }
        const r = await fetch(url);
        if (!r.ok) throw new Error(t("errWeatherApi"));
        const data = await r.json();
        if (data.error === true) {
          throw new Error(data.reason || t("errOpenMeteoDefault"));
        }

        if (tempPlot.querySelector(".js-plotly-plot")) {
          Plotly.purge(tempPlot);
        }
        tempPlotHint.hidden = true;

        if (res === "hour") {
          const times = data.hourly?.time || [];
          if (!times.length) {
            tempError.textContent = t("errHourlyEmpty");
            return;
          }
        } else {
          const times = data.daily?.time || [];
          if (!times.length) {
            tempError.textContent = t("errDailyEmpty");
            return;
          }
        }

        const { traces, layout } = buildPlotlyFigure(res, data, selectedPlace.label);
        await Plotly.newPlot(tempPlot, traces, layout, plotlyConfig);
        lastChartPayload = {
          res,
          data,
          placeLabel: selectedPlace.label,
        };
        tempPlotHint.hidden = false;
      } catch (e) {
        tempError.textContent = e instanceof Error ? e.message : String(e);
      } finally {
        btnLoadChart.disabled = false;
      }
    }

    btnGeoSearch.addEventListener("click", runGeoSearch);
    geoQuery.addEventListener("keydown", (e) => {
      if (e.key === "Enter") runGeoSearch();
    });
    btnLoadChart.addEventListener("click", loadTemperatureChart);

    function initDefaultDates() {
      const end = new Date();
      const start = new Date();
      start.setDate(start.getDate() - 14);
      const pad = (n) => String(n).padStart(2, "0");
      const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      dateEnd.value = ymd(end);
      dateStart.value = ymd(start);
    }
    initDefaultDates();

    function render() {
      grid.innerHTML = "";
      if (!tiles.length) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = t("emptyTiles");
        grid.appendChild(p);
        return;
      }
      for (const tile of tiles) {
        const info = timesByTz.get(tile.timezone) || {};
        const el = document.createElement("article");
        el.className = "tile";
        el.setAttribute("role", "listitem");
        el.draggable = true;
        el.dataset.id = tile.id;
        el.innerHTML = `
          <h2>${escapeHtml(tile.timezone)}</h2>
          <div class="time">${escapeHtml(formatTileDateTime(info))}</div>
          <button type="button" class="remove" draggable="false" data-id="${escapeHtml(tile.id)}" title="${escapeHtml(t("removeTitle"))}">×</button>
        `;
        const rm = el.querySelector(".remove");
        rm.addEventListener("click", (ev) => {
          ev.stopPropagation();
          removeTile(tile.id);
        });
        rm.addEventListener("mousedown", (ev) => ev.stopPropagation());
        grid.appendChild(el);
      }
    }

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function applyTimes(times) {
      timesByTz.clear();
      for (const x of times || []) {
        timesByTz.set(x.timezone, x);
      }
      render();
    }

    function connectWs() {
      ws = new WebSocket(wsUrl);
      ws.onopen = () => setWsStatus(true, t("wsLive"));
      ws.onclose = () => {
        setWsStatus(false, t("wsReconnecting"));
        setTimeout(connectWs, 2000);
      };
      ws.onerror = () => setWsStatus(false, t("wsError"));
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === "init" || msg.type === "tick") {
          tiles = msg.tiles || tiles;
          applyTimes(msg.times);
        } else if (msg.type === "tiles_updated") {
          tiles = msg.tiles || [];
          render();
        }
      };
    }

    grid.addEventListener("dragstart", (e) => {
      const tile = e.target.closest(".tile");
      if (!tile || e.target.closest(".remove")) {
        e.preventDefault();
        return;
      }
      dragSourceId = tile.dataset.id;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", dragSourceId);
      tile.classList.add("dragging");
    });

    grid.addEventListener("dragend", (e) => {
      grid.querySelectorAll(".tile.dragging, .tile.drag-over").forEach((el) => {
        el.classList.remove("dragging", "drag-over");
      });
      dragSourceId = null;
    });

    grid.addEventListener("dragover", (e) => {
      const tile = e.target.closest(".tile");
      if (!tile || !dragSourceId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
    });

    grid.addEventListener("dragenter", (e) => {
      const tile = e.target.closest(".tile");
      if (!tile || !dragSourceId || tile.dataset.id === dragSourceId) return;
      tile.classList.add("drag-over");
    });

    grid.addEventListener("dragleave", (e) => {
      const tile = e.target.closest(".tile");
      if (tile && e.relatedTarget && !tile.contains(e.relatedTarget)) {
        tile.classList.remove("drag-over");
      }
    });

    grid.addEventListener("drop", async (e) => {
      e.preventDefault();
      const targetTile = e.target.closest(".tile");
      grid.querySelectorAll(".tile.drag-over").forEach((el) => el.classList.remove("drag-over"));
      if (!targetTile || !dragSourceId) return;
      const targetId = targetTile.dataset.id;
      const sourceId = dragSourceId;
      if (sourceId === targetId) return;
      const from = tiles.findIndex((t) => t.id === sourceId);
      const to = tiles.findIndex((t) => t.id === targetId);
      if (from < 0 || to < 0) return;
      const prev = tiles.map((t) => ({ ...t }));
      const next = [...tiles];
      const [moved] = next.splice(from, 1);
      next.splice(to, 0, moved);
      tiles = next;
      render();
      try {
        const r = await apiFetch("/api/tiles/order", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ order: next.map((t) => t.id) }),
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          tiles = prev;
          render();
          alert(err.detail || r.statusText);
        }
      } catch (err) {
        tiles = prev;
        render();
        alert(String(err));
      }
    });

    async function loadTimezones() {
      const r = await apiFetch("/api/timezones?limit=500");
      const data = await r.json();
      allZones = data.timezones || [];
      filterSelect();
    }

    function filterSelect() {
      const q = (tzSearch.value || "").toLowerCase();
      const filtered = q
        ? allZones.filter((z) => z.toLowerCase().includes(q))
        : allZones.slice(0, 150);
      tzSelect.innerHTML = "";
      for (const z of filtered.slice(0, 200)) {
        const opt = document.createElement("option");
        opt.value = z;
        opt.textContent = z;
        tzSelect.appendChild(opt);
      }
      if (!tzSelect.options.length) {
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = t("selectNoResult");
        tzSelect.appendChild(opt);
      }
    }

    tzSearch.addEventListener("input", filterSelect);

    btnAdd.addEventListener("click", async () => {
      const timezone = tzSelect.value;
      if (!timezone) return;
      btnAdd.disabled = true;
      try {
        const r = await apiFetch("/api/tiles", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ timezone }),
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          alert(err.detail || r.statusText);
        }
      } finally {
        btnAdd.disabled = false;
      }
    });

    async function removeTile(id) {
      const r = await apiFetch(`/api/tiles/${encodeURIComponent(id)}`, { method: "DELETE" });
      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        alert(err.detail || r.statusText);
      }
    }

    applyLocale();
    loadAppVersion();
    loadTimezones();
    connectWs();
  </script>
</body>
</html>
